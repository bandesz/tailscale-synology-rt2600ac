min_version = "2025.1.0"

[tools]
go = "1.26.6"
shellcheck = "0.11.0"

[tasks.lint]
description = "Lint the package scripts"
run = "shellcheck build-srm-spk.sh scripts/release.sh scripts/build-each.sh test/syno-version.sh test/disable-dns.sh test/advertise-routes.sh test/routing-offers.sh test/state-backup.sh test/publish-ui.sh test/tar-owner.sh test/srm-targets.sh srm/start-stop-status srm/preinst srm/postinst srm/preuninst srm/postuninst srm/preupgrade srm/postupgrade srm/WIZARD_UIFILES/upgrade_uifile.sh"

[tasks.test]
description = "Check version numbering and that service start turns Tailscale DNS off"
run = "sh test/syno-version.sh && sh test/disable-dns.sh && sh test/advertise-routes.sh && sh test/routing-offers.sh && sh test/state-backup.sh && sh test/publish-ui.sh && sh test/tar-owner.sh && sh test/srm-targets.sh"

[tasks.build]
description = "Download the Tailscale armv7 DSM 7 SPK and build the SRM package for SRM_ARCH. Optional argument: version, for example 1.104.7"
run = "sh build-srm-spk.sh"

[tasks.ci]
description = "Lint, test, and build every SRM package"
depends = ["lint", "test"]
run = "sh scripts/build-each.sh"

[tasks.release]
description = "Build both SRM packages and attach them to a GitHub release. Optional argument: Tailscale version"
depends = ["lint", "test"]
run = "sh scripts/release.sh"
