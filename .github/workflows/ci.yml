name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ipq806x, hawkeye]
    env:
      SRM_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run build
      - uses: actions/upload-artifact@v4
        with:
          name: srm-spk-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error
