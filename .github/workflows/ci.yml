name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci
      - uses: actions/upload-artifact@v4
        with:
          name: srm-spk
          path: dist/*.spk
          if-no-files-found: error
